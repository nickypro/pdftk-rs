name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The full suite. Most tests run pdftk-rs and the Java pdftk side by side and
  # compare exit code, stderr, text output, page text, rasters and qpdf --check.
  # Debian 12 ships pdftk-java 3.3.2, the version the comparisons were written against.
  oracle:
    name: Tests against Java pdftk
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - name: Install the oracle and validators
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential \
            pdftk-java default-jre-headless qpdf poppler-utils fonts-dejavu-core
      - uses: actions/checkout@v4
      - name: Run tests as an unprivileged user
        run: |
          useradd -m tester
          chown -R tester "$GITHUB_WORKSPACE"
          su - tester -c "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
          su - tester -c "cd '$GITHUB_WORKSPACE' && ~/.cargo/bin/cargo test --locked"

  # Build and smoke-test on every platform we release for.
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --locked --release
      - name: Smoke test
        shell: bash
        run: bash scripts/smoke.sh target/release/pdftk-rs
